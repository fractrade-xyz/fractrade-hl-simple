[tool.poetry]
name = "fractrade-hl-simple"
version = "0.4.0"
description = "Python client for Hyperliquid perpetual futures, with an MCP server for Claude Code and Claude Desktop"
authors = ["crjameson <93468664+crjameson@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "fractrade_hl_simple", from = "src"}]
homepage = "https://fractrade.xyz"
repository = "https://github.com/fractrade-xyz/fractrade-hl-simple"
documentation = "https://github.com/fractrade-xyz/fractrade-hl-simple"
keywords = ["hyperliquid", "trading", "perpetual-futures", "crypto", "defi", "api", "mcp", "mcp-server", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.4"  # 2.32.4 fixes CVE-2024-47081 (.netrc credentials sent to the wrong host)
python-dotenv = "^1.0.1"
# 0.24.0 is the floor: SDK <= 0.22 cannot build a client against today's mainnet
# spotMeta (token indexes are no longer list positions; SDK issue #301). The ceiling: the
# library uses SDK internals, so each new SDK minor version is checked before it is allowed.
hyperliquid-python-sdk = ">=0.24.0,<0.25"
eth-account = ">=0.10.0"  # imported directly; the SDK sets the upper bound
dacite = "^1.9.1"
# The MCP server (pip install "fractrade-hl-simple[mcp]"); the library itself does not need it.
mcp = { version = ">=2.3,<3", optional = true }
jsonschema = { version = ">=4.20", optional = true }  # the server checks tool arguments with it

[tool.poetry.extras]
mcp = ["mcp", "jsonschema"]

[tool.poetry.scripts]
fractrade-hl-mcp = "fractrade_hl_simple.mcp_server.__main__:main"


[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
ruff = "^0.17.5"
mypy = "^2.4.1"

[tool.poetry.group.test.dependencies]
requests-mock = "^1.12.1"
pytest-mock = "^3.17.0"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# pyflakes, the syntax and import errors of pycodestyle, bugbear and pylint's errors
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = ["B905"]  # zip() without strict=: lists of equal length by construction, or a deliberate pairwise zip

[tool.ruff.lint.per-file-ignores]
# the live trading tests are left as they are
"tests/test_integration.py" = ["F841"]
"tests/test_blast_integration.py" = ["E722"]

[tool.mypy]
files = ["src/fractrade_hl_simple"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# The MCP server and pnl.py are checked as with --strict (which mypy only takes for all modules).
[[tool.mypy.overrides]]
module = [
    "fractrade_hl_simple.mcp_server.*",
    "fractrade_hl_simple.pnl",
    "fractrade_hl_simple._answers",
    "fractrade_hl_simple._inputs",
    "fractrade_hl_simple._maker",
    "fractrade_hl_simple._protection",
    "fractrade_hl_simple._signing",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

