# fractrade-hl-mcp configuration: copy to ~/.config/fractrade-hl/mcp.toml, chmod 600 it, and edit.
# Reference: docs/mcp.md. Check it with: fractrade-hl-mcp --check
# Private keys never go into this file (one in it stops the server): use key_file or key_env.

default_account = "main"           # the account read tools use when a call names none

[defaults]                         # inherited by every account below
base_url = "https://api.hyperliquid.xyz"   # mainnet; https://api.hyperliquid-testnet.xyz for testnet
max_slippage = 0.01                # market orders and closes: at most 1 % from the mid (TP/SL: Hyperliquid's 10 %)
perp_dexs = ["xyz"]                # HIP-3 dexes besides Hyperliquid's own perps, e.g. ["xyz", "para", "io"]

# An account the server can trade, once started with --enable-trading.
[accounts.main]
address = "0x0000000000000000000000000000000000000001"   # your account's address
key_file = "~/.config/fractrade-hl/keys/main"            # its API wallet's key (never the account's own); mode 0600
trading = true
max_leverage = 5                   # the highest leverage set_leverage may set
max_margin_pct = 5                 # optional: one order's margin (value / leverage), at most 5 % of the account
max_total_margin_pct = 30          # optional: positions, pending entries and new orders, at most 30 % as margin
max_daily_loss_pct = 10            # optional: lost 10 % over 24 hours, then no new risk until it recovers
# Limits with a mode: off, warn (default: the order goes through with a warning) or block.
# max_day_loss_pct = 4             # lost 4 % since the trading day started (day_start in tz)
# max_day_loss_mode = "warn"
# day_start = "06:00"              # default "00:00"
# tz = "Europe/Athens"             # default "UTC"
# max_total_notional_x = 3         # positions and open orders that add risk at most 3x the account value
# max_total_notional_mode = "warn"
max_orders_per_hour = 30           # optional: orders that add risk, per hour
check_order_leverage = true        # optional: refuse orders on a market whose leverage is above max_leverage
# isolated_only = true             # optional: isolated margin only, so a position loses at most its margin
# max_risk_pct = 1                 # optional: open_position's estimated loss at its stop losses (fees and
                                   # order-book slippage, at entry) at most 1 %; other orders that add risk
                                   # are then refused
max_order_usd = 2000               # optional: the value of one order, at most (keep one of the three size limits)
symbols = ["BTC", "ETH", "xyz:NVDA"]   # optional: only these markets (closing is never limited)

# A vault or sub-account: traded with an API wallet of the account that controls it.
[accounts.vault]
address = "0x0000000000000000000000000000000000000002"
vault = true

# A testnet account: testnet has other HIP-3 dexes.
[accounts.test]
address = "0x0000000000000000000000000000000000000003"
base_url = "https://api.hyperliquid-testnet.xyz"
perp_dexs = []

# Any wallet to watch: read only.
[accounts.whale]
address = "0x0000000000000000000000000000000000000004"
